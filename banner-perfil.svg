<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#0d1117"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.05"/>
  <circle cx="150" cy="150" r="160" fill="#00D9FF" opacity="0.04"/>
  <circle cx="1050" cy="150" r="140" fill="#FF6B35" opacity="0.05"/>

  <!-- Nós decorativos esquerda -->
  <circle cx="90" cy="80" r="22" fill="#0d2233" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="90" y="85" text-anchor="middle" fill="#00D9FF" font-size="13" font-family="monospace">N8N</text>
  <circle cx="80" cy="230" r="18" fill="#0d2233" stroke="#3fb950" stroke-width="1.5"/>
  <text x="80" y="235" text-anchor="middle" fill="#3fb950" font-size="11" font-family="monospace">RAG</text>
  <circle cx="170" cy="40" r="16" fill="#0d2233" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="170" y="45" text-anchor="middle" fill="#d2a8ff" font-size="10" font-family="monospace">LLM</text>

  <!-- Nós decorativos direita -->
  <circle cx="1110" cy="90" r="22" fill="#0d2233" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="1110" y="95" text-anchor="middle" fill="#FF6B35" font-size="13" font-family="monospace">API</text>
  <circle cx="1120" cy="230" r="18" fill="#0d2233" stroke="#e3b341" stroke-width="1.5"/>
  <text x="1120" y="235" text-anchor="middle" fill="#e3b341" font-size="10" font-family="monospace">GPT</text>
  <circle cx="1040" cy="40" r="16" fill="#0d2233" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="1040" y="45" text-anchor="middle" fill="#00D9FF" font-size="10" font-family="monospace">SQL</text>

  <!-- Linhas de conexão -->
  <line x1="112" y1="90" x2="550" y2="145" stroke="#00D9FF" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="98" y1="222" x2="550" y2="165" stroke="#3fb950" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="1088" y1="98" x2="650" y2="145" stroke="#FF6B35" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="1102" y1="222" x2="650" y2="165" stroke="#e3b341" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Nó central IA -->
  <circle cx="600" cy="155" r="70" fill="#0d1a2e" stroke="#00D9FF" stroke-width="2"/>
  <circle cx="600" cy="155" r="58" fill="#0d1a2e" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <text x="600" y="148" text-anchor="middle" fill="#00D9FF" font-size="18" font-family="monospace" font-weight="bold">AI</text>
  <text x="600" y="168" text-anchor="middle" fill="#00D9FF" font-size="13" font-family="monospace">AGENT</text>

  <!-- Textos principais -->
  <text x="600" y="252" text-anchor="middle" fill="#e6edf3" font-size="32" font-family="monospace" font-weight="bold" letter-spacing="4">FABRYCIO BERMUDES</text>
  <text x="600" y="282" text-anchor="middle" fill="#00D9FF" font-size="15" font-family="monospace" letter-spacing="3">ENGENHEIRO DE SOFTWARE &amp; AGENTES DE IA</text>
</svg>
