<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Robozinho acenando">
  <title>Robozinho acenando</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4d6e"/>
      <stop offset="1" stop-color="#22304a"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFE9A0"/>
      <stop offset="1" stop-color="#FFB300"/>
    </radialGradient>
  </defs>

  <style>
    .bot   { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .shadow { transform-origin: 80px 148px; animation: shadow 2.4s ease-in-out infinite; }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.85); opacity: .2; } }

    .wave  { transform-origin: 108px 92px; animation: wave 1.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 100% { transform: rotate(-150deg); }
      50%      { transform: rotate(-110deg); }
    }

    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.1); } }

    .led   { animation: led 1.2s steps(1, end) infinite; }
    @keyframes led { 0%, 100% { fill: #00D9FF; } 50% { fill: #FF5A5A; } }

    .heart { transform-box: fill-box; transform-origin: center; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.18); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .bot, .shadow, .wave, .eye, .led, .heart { animation: none; }
      .wave { transform: rotate(-130deg); }
    }
  </style>

  <ellipse class="shadow" cx="80" cy="148" rx="30" ry="5" fill="#000"/>

  <g class="bot">
    <!-- antena -->
    <line x1="80" y1="18" x2="80" y2="32" stroke="#8fa3c4" stroke-width="3" stroke-linecap="round"/>
    <circle class="led" cx="80" cy="14" r="5" fill="#00D9FF"/>

    <!-- orelhas -->
    <rect x="38" y="46" width="8" height="16" rx="3" fill="#00D9FF"/>
    <rect x="114" y="46" width="8" height="16" rx="3" fill="#00D9FF"/>

    <!-- cabeça -->
    <rect x="44" y="30" width="72" height="48" rx="14" fill="url(#metal)" stroke="#00D9FF" stroke-width="2.5"/>
    <rect x="52" y="40" width="56" height="28" rx="10" fill="#0d1117"/>
    <rect class="eye" x="62" y="47" width="10" height="12" rx="4" fill="#00D9FF"/>
    <rect class="eye" x="88" y="47" width="10" height="12" rx="4" fill="#00D9FF"/>
    <path d="M73 63 q7 5 14 0" fill="none" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- braço esquerdo (parado) -->
    <rect x="34" y="88" width="12" height="30" rx="6" fill="url(#metal)" stroke="#00D9FF" stroke-width="2"/>

    <!-- braço direito (acenando) -->
    <g class="wave">
      <rect x="102" y="88" width="12" height="30" rx="6" fill="url(#metal)" stroke="#00D9FF" stroke-width="2"/>
      <circle cx="108" cy="122" r="7" fill="#8fa3c4" stroke="#00D9FF" stroke-width="2"/>
    </g>

    <!-- corpo -->
    <rect x="50" y="82" width="60" height="50" rx="12" fill="url(#metal)" stroke="#00D9FF" stroke-width="2.5"/>
    <circle class="heart" cx="80" cy="102" r="8" fill="url(#core)"/>
    <rect x="66" y="117" width="28" height="4" rx="2" fill="#00D9FF" opacity=".5"/>

    <!-- pernas -->
    <rect x="60" y="132" width="12" height="10" rx="3" fill="#8fa3c4"/>
    <rect x="88" y="132" width="12" height="10" rx="3" fill="#8fa3c4"/>
  </g>
</svg>
